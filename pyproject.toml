[tool.poetry]
name = "python-api"
version = "0.1.0"
description = "Building an API with Python"
authors = ["midega-g <midegageorge2@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version="^0.141.1", extras=["all"]}
starlette = ">=1.3.1"  # patched (CVE-2026-54283 and others)
SQLAlchemy = "^2.0.37"
psycopg = {version="^3.2.4", extras=["binary"]}
bcrypt = "^4.2.1"
PyJWT = {version="^2.10.1", extras=["crypto"]}
cryptography = ">=49.0"  # pin to patched version (CVE-2026-69249)
alembic = "^1.14.1"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
black = "^26.3.1"
isort = "^6.0.0"
pylint = "^3.3.4"
detect-secrets = "^1.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 80
target-version = ['py311']
skip-string-normalization = true

[tool.pylint.messages_control]
disable = [
    "missing-function-docstring",
    "missing-final-newline",
    "missing-module-docstring",
    "missing-class-docstring",
    "invalid-name",
    "no-member",
    "too-few-public-methods",
    "ungrouped-imports"
]
